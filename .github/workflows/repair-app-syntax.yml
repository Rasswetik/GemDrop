name: Verify GemDrop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Verify critical integration wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          html = Path("templates/index.html").read_text(encoding="utf-8")
          checks = {
              "portal reserve": "PORTAL_WITHDRAW_RESERVE=Decimal('0.30')" in app,
              "Portal Partner withdrawal": "/partners/nfts/withdraw" in app,
              "Relayer Partner token": "portal_partner_auth" in app,
              "broadcast queue": "def _bc_process_batch" in app,
              "broadcast staging": "staged_user_id" in app,
              "manual withdrawal state": "manual_required" in app,
              "Portal runtime panel": "portalPartnerBalance" in html,
              "Mini App actions": "Открыть приложение" in html,
          }
          print(checks)
          assert all(checks.values()), checks
          PY
