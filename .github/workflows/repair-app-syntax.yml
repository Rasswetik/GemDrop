name: Repair app.py syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair broken Relayr regex
        run: python fix_app_syntax.py
      - name: Repair PostgreSQL runtime compatibility
        run: python fix_postgres_runtime.py
      - name: Repair NFT profile artwork
        run: python fix_profile_nft_images.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit repaired app.py
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py already valid"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Repair app.py syntax before Render deploy"
          git push
