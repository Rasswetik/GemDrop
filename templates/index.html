<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081727"><title>GemDrop</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#081625;--surface:#102439;--surface2:#16324b;--line:#244560;--text:#f0f9ff;--muted:#8caec4;--accent:#61d1ff;--blue:#258fee;--danger:#ff798c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 90% 420px at 50% -180px,#20628c 0%,transparent 90%),var(--bg);color:var(--text);font:500 14px system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.47;cursor:default}.hidden{display:none!important}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px calc(106px + env(safe-area-inset-bottom))}h1,h2,p{margin-top:0}h1{font-size:29px;letter-spacing:-.04em;margin-bottom:0}h2{font-size:17px;margin-bottom:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px}.identity{display:flex;align-items:center;gap:9px;min-width:0}.avatar{height:42px;width:42px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:15px;background:#244e6d;color:#9de7ff;font-size:19px;font-weight:800}.avatar img{height:100%;width:100%;object-fit:cover}.identity strong{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.balance{display:flex;align-items:center;gap:7px;min-height:43px;padding:6px 10px;border:1px solid #3679a1;border-radius:14px;background:#173c58;white-space:nowrap;font-weight:800}.balance img,.ton{width:22px;height:22px;object-fit:contain}.balance img.gift-icon{width:28px;height:28px}.title-row,.status-row,.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title-row{margin-bottom:17px}.mine-badge{border-radius:12px;padding:8px 11px;color:#b7e9ff;background:var(--surface2);font-weight:750}.ladder{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none;padding:3px 1px 14px;scroll-snap-type:x proximity}.ladder::-webkit-scrollbar{display:none}.level{flex:none;min-width:75px;height:80px;scroll-snap-align:center;border:1px solid var(--line);border-radius:15px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:#c2dbe9}.level.current{background:linear-gradient(145deg,#43b6f2,#227ee0);color:#fff;border-color:#79d8ff;box-shadow:0 6px 22px #168ded44}.level.passed{border-color:#3794c5}.level img{height:29px;width:29px;object-fit:contain}.level b{font-size:12px}.level small{font-size:10px;max-width:69px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.level .icon{font-size:22px;color:var(--accent)}.level.current .icon{color:#fff}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:15px;border-radius:24px;background:#102438;border:1px solid #24435d;box-shadow:0 14px 38px #020e1a55}.cell{position:relative;aspect-ratio:1;border:1px solid #37637e;border-radius:13px;background:linear-gradient(150deg,#285879,#193d59);box-shadow:inset 0 -4px #0c2b44,0 3px 10px #03132050;display:grid;place-items:center;transition:transform .18s,background .25s,border-color .25s}.cell:not(:disabled):active{transform:scale(.9)}.cell:not(.open):not(.mine):after{content:'';width:11px;height:11px;border:2px solid #88ceee;border-radius:4px;transform:rotate(45deg);opacity:.62}.cell:disabled{opacity:1}.cell.open{background:#1b526d;border-color:#53add2;box-shadow:inset 0 0 18px #42d4fb2a}.cell.mine{background:#553444;border-color:#ff8192;box-shadow:inset 0 0 18px #ff708333}.cell.mine.ghost{opacity:.55}.cell img{width:78%;height:78%;object-fit:contain}.cell.reveal img{animation:pop .44s cubic-bezier(.22,1.45,.45,1) both}.cell.mine.reveal img{animation:boom .58s ease both}@keyframes pop{0%{transform:scale(.1) rotate(-24deg);opacity:0}75%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}@keyframes boom{0%{transform:scale(.1);opacity:0}50%{transform:scale(1.23) rotate(9deg);opacity:1}75%{transform:scale(.94) rotate(-5deg)}100%{transform:scale(1)}}.status-row{padding:13px 4px 19px;color:var(--muted);font-size:12px}.status-row b{color:var(--accent);font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}.caption{display:block;margin:0 0 7px 2px;color:var(--muted);font-size:11px;font-weight:700}.field{height:53px;padding:0 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.field input{min-width:0;max-width:100%;width:100%;outline:0;border:0;background:transparent;color:var(--text);font-size:18px;font-weight:800}.stepper{justify-content:space-between;gap:4px;padding:0 6px}.stepper button{flex:none;width:36px;height:38px;border-radius:10px;background:#244c69;color:#e4f7ff;font-size:23px;line-height:1}.stepper strong{font-size:19px;min-width:20px;text-align:center}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 13px}.quick button{height:35px;border-radius:9px;color:#bde9fb;background:#18374f;border:1px solid var(--line);font-size:11px;font-weight:800}.primary,.secondary{width:100%;border-radius:15px;padding:15px;font-size:14px;font-weight:850}.primary{background:linear-gradient(115deg,#71d9ff,#359bf5);color:#05223d;box-shadow:0 9px 26px #1f98ef35}.secondary{background:#1c4c6d;border:1px solid #3f9fce;color:#c9f2ff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:5;width:min(480px,100%);display:flex;justify-content:space-around;padding:9px 15px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b2034f2;backdrop-filter:blur(18px)}.nav button{display:grid;justify-items:center;gap:3px;min-width:110px;background:transparent;color:var(--muted);font-size:11px}.nav button.active{color:var(--accent)}.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}.profile-hero{text-align:center;padding:25px 18px 24px;border-radius:24px;border:1px solid #376182;background:radial-gradient(circle at 50% 0%,#245d83,#14314d 60%,#102439)}.profile-hero .avatar{height:83px;width:83px;margin:0 auto 12px;border-radius:26px;font-size:33px;box-shadow:0 10px 28px #010f1b77}.profile-hero h1{font-size:24px}.handle{margin:5px 0 18px;color:var(--muted)}.profile-balance{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border:1px solid #418cb7;border-radius:13px;background:#102d46;font-size:18px;font-weight:850}.panel{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;margin:15px 0}.panel h2{margin:0}.panel-head{margin-bottom:15px}.panel-head span{color:var(--accent);font-weight:800}.inventory,.gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gift{padding:10px;border-radius:15px;background:#18344d;border:1px solid #28516b;min-width:0}.gift-art{display:grid;place-items:center;height:112px;margin-bottom:9px;border-radius:11px;background:radial-gradient(circle,#28638a,#14314a 72%);font-size:30px;color:var(--accent)}.gift-art img{height:100%;width:100%;object-fit:contain}.gift strong,.gift small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gift small{margin-top:4px;color:#86d9ff}.empty{grid-column:1/-1;text-align:center;padding:42px 12px;color:var(--muted);border:1px dashed #325777;border-radius:15px}.admin-menu,.stack{display:grid;gap:11px}.admin-menu button,.user-row{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);text-align:left;font-weight:750}.back{padding:0 0 22px;background:transparent;color:var(--accent);font-weight:750}.text-input{width:100%;min-width:0;padding:12px;border:1px solid #396480;border-radius:12px;outline:0;background:#0c2033;color:var(--text)}.text-input:focus{border-color:var(--accent)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .text-input{flex:1}.mini-btn,.danger-btn{flex:none;padding:11px;border-radius:11px;background:#1d5273;color:#bceeff;border:1px solid #4193bf;font-weight:750}.danger-btn{background:#513044;border-color:#a35f7b;color:#ffd5df}.user-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.user-row small{color:var(--muted)}.notice{padding:12px;border:1px solid #407ba1;border-radius:12px;background:#173750;color:#cbefff;line-height:1.45}.notice.error{border-color:#aa5b72;background:#4b3040;color:#ffd1dd}.toast{position:fixed;z-index:12;bottom:98px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 16px;border-radius:12px;background:#d9f4ff;color:#0d2b41;text-align:center;font-size:12px;font-weight:800;box-shadow:0 15px 35px #0008}.modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:#04111dd9;backdrop-filter:blur(7px)}.modal-card{width:min(100%,375px);border:1px solid #4593bc;border-radius:25px;padding:26px 23px 22px;text-align:center;background:radial-gradient(circle at 50% 15%,#225b81,#132e49 67%);box-shadow:0 20px 70px #0009;animation:modalIn .34s ease-out}.modal-card h2{font-size:25px;margin:0 0 12px}.modal-art{display:grid;place-items:center;margin:0 auto 12px;width:155px;height:155px;border-radius:23px;background:radial-gradient(circle,#2c789e,#17364f 72%)}.modal-art img{width:90%;height:90%;object-fit:contain;animation:pop .5s both}.modal-name{font-size:19px;font-weight:800}.modal-price{margin:8px 0 18px;color:#afe6ff}.modal-extra{margin:-3px 0 17px;color:#b9d9e9;font-size:12px}@keyframes modalIn{from{transform:translateY(22px) scale(.94);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.auth{max-width:390px;margin:18vh auto;text-align:center}.auth h1{font-size:34px}.auth p{color:var(--muted);line-height:1.55;margin:14px 0 20px}@media(max-width:370px){.app{padding-left:12px;padding-right:12px}.board{gap:6px;padding:10px}.cell{border-radius:10px}.identity strong{max-width:105px}.stepper button{width:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="app">
<section id="auth" class="auth hidden"><h1>GemDrop</h1><p id="authText">Подключаем Telegram…</p><button id="retry" class="primary">Повторить</button></section>
<div id="content" class="hidden">
<section id="minesPage"><header class="top"><div class="identity"><div id="smallAvatar" class="avatar">G</div><strong id="nick">Игрок</strong></div><div class="balance"><img id="balanceIcon" src="/static/img/ton.png" alt="TON"><span id="balance">0.00</span></div></header>
<div class="title-row"><h1>Мины</h1><div id="mineBadge" class="mine-badge">3 мины</div></div><div id="ladder" class="ladder" aria-label="Уровни призов"></div><div id="board" class="board" aria-label="Игровое поле, 25 клеток"></div><div class="status-row"><span id="boardStatus">Выберите ставку</span><b id="multiplier">×1.00</b></div>
<div class="controls"><div><label class="caption" for="bet">Ставка, TON</label><div class="field"><img class="ton" src="/static/img/ton.png" alt=""><input id="bet" type="number" min="0.10" max="1000" step="0.01" value="0.10" inputmode="decimal"></div></div><div><span class="caption">Количество мин</span><div class="field stepper"><button id="minusMine" type="button" aria-label="Уменьшить количество мин">−</button><strong id="mineCount">3</strong><button id="plusMine" type="button" aria-label="Увеличить количество мин">+</button></div></div></div>
<div class="quick"><button data-bet="min">МИН</button><button data-bet="half">/2</button><button data-bet="double">×2</button><button data-bet="max">МАКС</button></div><button id="start" class="primary">Играть</button><button id="cashout" class="primary hidden">Забрать</button></section>
<section id="profilePage" class="hidden"><div class="profile-hero"><div id="bigAvatar" class="avatar">G</div><h1 id="profileName">Игрок</h1><p id="profileHandle" class="handle"></p><div class="profile-balance"><img class="ton" src="/static/img/ton.png" alt="TON"><span id="profileBalance">0.00</span> TON</div></div><section class="panel"><div class="panel-head"><h2>Инвентарь</h2><span id="inventoryCount">0</span></div><div id="inventoryGrid" class="inventory"></div></section><button id="adminEntry" class="secondary hidden">Админ-панель</button></section>
<section id="adminPage" class="hidden"><button id="adminHome" class="back">← В главное меню</button><h1>Админ-панель</h1><div class="panel admin-menu"><button id="openPortal">Portal Market →</button><button id="openUsers">Пользователи →</button></div></section>
<section id="portalPage" class="hidden"><button id="portalBack" class="back">← Админ-панель</button><h1>Portal Market</h1><div class="panel stack"><label class="caption" for="portalKey">Ключ Portal Market</label><input id="portalKey" class="text-input" type="password" autocomplete="off" placeholder="Ключ или tma ..."><button id="importPortal" class="primary">Обновить каталог</button><button id="refreshImages" class="secondary">Обновить PNG</button><div id="portalStatus" class="notice">Каталог ещё не загружен.</div></div><div class="panel"><div class="panel-head"><h2>Коллекции</h2><span id="giftCount">0</span></div><div id="giftGrid" class="gift-grid"></div></div></section>
<section id="usersPage" class="hidden"><button id="usersBack" class="back">← Админ-панель</button><h1>Пользователи</h1><div class="panel row"><input id="userSearch" class="text-input" placeholder="Имя, @username или ID"><button id="findUsers" class="mini-btn">Найти</button></div><div id="usersList" class="stack"></div></section>
<section id="userPage" class="hidden"><button id="userBack" class="back">← Пользователи</button><h1 id="adminUserName">Игрок</h1><p id="adminUserId" class="handle"></p><div class="panel stack"><h2>Баланс TON</h2><div class="row"><input id="adminBalance" class="text-input" type="number" step="0.01" min="0"><button id="saveBalance" class="mini-btn">Сохранить</button></div></div><div class="panel stack"><h2>Подтверждённый депозит</h2><div class="row"><input id="depositAmount" class="text-input" type="number" step="0.01" min="0.01" placeholder="TON"><button id="creditDeposit" class="mini-btn">Начислить</button></div></div><div class="panel stack"><h2>Добавить подарок</h2><select id="adminGift" class="text-input"></select><button id="addGift" class="mini-btn">Добавить</button></div><div class="panel"><div class="panel-head"><h2>Инвентарь</h2></div><div id="adminInventory" class="stack"></div></div></section>
</div><nav id="nav" class="nav hidden"><button data-page="minesPage" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" stroke-linecap="round" stroke-width="3"/></svg>Мины</button><button data-page="profilePage"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.5-4 3-6 7.5-6s7 2 7.5 6"/></svg>Профиль</button></nav></main>
<div id="toast" class="toast hidden" role="status"></div><div id="rewardModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rewardHeading"><div class="modal-card"><h2 id="rewardHeading">Поздравляем!</h2><div class="modal-art"><img id="rewardImage" src="/static/img/ton.png" alt=""></div><div id="rewardName" class="modal-name"></div><p id="rewardPrice" class="modal-price"></p><p id="rewardExtra" class="modal-extra hidden"></p><button id="claimReward" class="primary">Забрать</button></div></div>
<script>
const tg=window.Telegram?.WebApp,$=id=>document.getElementById(id),TON='/static/img/ton.png';
let user=null,round=null,lastRound=null,mines=3,levels=[],recentCell=null,selectedUser=null,catalogItems=[],busy=false;
const money=n=>Number(n||0).toFixed(2);
function toast(message){let e=$('toast');e.textContent=message;e.classList.remove('hidden');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.add('hidden'),3100)}
async function api(path,opts={}){let r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Ошибка сервера');return data}
function avatar(el,u){el.textContent=(u.name||'G').charAt(0).toUpperCase();if(u.photo_url){let img=new Image;img.src=u.photo_url;img.alt='Аватар';img.onerror=()=>{el.textContent=(u.name||'G').charAt(0).toUpperCase()};el.replaceChildren(img)}}
function topReward(){let prize=round?.state==='active'&&round.opened.length?round.prize:null,icon=$('balanceIcon');icon.src=prize?.image_url||TON;icon.classList.toggle('gift-icon',!!prize?.image_url);icon.alt=prize?.name||'TON';icon.onerror=()=>{icon.onerror=null;icon.src=TON};$('balance').textContent=prize?prize.name:round?.opened.length?money(round.potential):money(user?.balance)}
function setUser(u){user=u;$('nick').textContent=u.name;$('profileBalance').textContent=money(u.balance);$('profileName').textContent=u.name;$('profileHandle').textContent=u.username?'@'+u.username:'Telegram';avatar($('smallAvatar'),u);avatar($('bigAvatar'),u);$('adminEntry').classList.toggle('hidden',!u.admin);topReward()}
function show(name){if(['adminPage','portalPage','usersPage','userPage'].includes(name)&&!user?.admin)return;for(let id of ['minesPage','profilePage','adminPage','portalPage','usersPage','userPage'])$(id).classList.toggle('hidden',id!==name);$('nav').classList.toggle('hidden',!['minesPage','profilePage'].includes(name));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));if(name==='profilePage')loadInventory();if(name==='portalPage')loadCatalog();if(name==='usersPage')loadUsers();window.scrollTo(0,0)}
function itemCard(item){let card=document.createElement('article');card.className='gift';let art=document.createElement('div');art.className='gift-art';art.textContent='✦';if(item.image_url){let img=new Image;img.loading='lazy';img.src=item.image_url;img.alt=item.name;img.onerror=()=>img.remove();art.replaceChildren(img)}let name=document.createElement('strong');name.textContent=item.name;let price=document.createElement('small');price.textContent=item.price_ton==null?'—':money(item.price_ton)+' TON';card.append(art,name,price);return card}
async function loadInventory(){try{let d=await api('/api/inventory'),grid=$('inventoryGrid');grid.replaceChildren();$('inventoryCount').textContent=d.items.length;if(!d.items.length){let el=document.createElement('div');el.className='empty';el.textContent='Инвентарь пуст';grid.append(el)}else d.items.forEach(item=>grid.append(itemCard(item)))}catch(e){toast(e.message)}}
let ladderSeq=0;async function refreshLadder(){let seq=++ladderSeq;try{let b=round?.bet??$('bet').value,m=round?.mines??mines;let d=await api(`/api/game/ladder?bet=${encodeURIComponent(b)}&mines=${m}`);if(seq===ladderSeq){levels=d.levels;drawLadder()}}catch(e){if(seq===ladderSeq){levels=[];drawLadder()}}}
function drawLadder(){let strip=$('ladder'),step=round?.opened.length??0;strip.replaceChildren();for(let item of levels){let card=document.createElement('div');card.className='level'+(item.step===step?' current':item.step<step?' passed':'');if(item.prize?.image_url){let img=new Image;img.src=item.prize.image_url;img.alt=item.prize.name;img.onerror=()=>{img.replaceWith(document.createTextNode('✦'))};card.append(img)}else{let icon=document.createElement('span');icon.className='icon';icon.textContent='◆';card.append(icon)}let value=document.createElement('b');value.textContent='×'+money(item.multiplier);let caption=document.createElement('small');caption.textContent=item.prize?item.prize.name:money(item.amount)+' TON';card.append(value,caption);strip.append(card)}let current=strip.querySelector('.current');if(current)current.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}
function paint(){let state=round||lastRound,active=round?.state==='active',opened=state?.opened||[],board=$('board');board.replaceChildren();for(let i=0;i<25;i++){let b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('aria-label','Клетка '+(i+1));let safe=opened.includes(i),mine=state?.positions?.includes(i);if(safe||mine){b.classList.add(safe?'open':'mine');if(mine&&state?.lost_cell!==i)b.classList.add('ghost');if(recentCell===i)b.classList.add('reveal');let img=new Image;img.src=safe?'/static/img/mine1.png':'/static/img/mine2.png';img.alt=safe?'Безопасно':'Мина';b.append(img)}b.disabled=!active||safe||busy;b.onclick=()=>openCell(i);board.append(b)}recentCell=null;$('mineCount').textContent=mines;$('mineBadge').textContent=`${mines} ${mines===1?'мина':mines<5?'мины':'мин'}`;let locked=!!active;$('bet').disabled=locked;$('minusMine').disabled=locked||mines===1;$('plusMine').disabled=locked||mines===20;document.querySelectorAll('.quick button').forEach(b=>b.disabled=locked);$('start').classList.toggle('hidden',locked);$('cashout').classList.toggle('hidden',!locked);$('cashout').disabled=!round?.opened.length||busy;$('cashout').textContent=round?.prize?'Забрать подарок':'Забрать '+money(round?.potential)+' TON';$('boardStatus').textContent=active?`Открыто: ${opened.length} / ${25-mines}`:state?.state==='lost'?'Мина. Раунд завершён':state?.state==='won'?'Раунд завершён':'Выберите ставку';$('multiplier').textContent='×'+money(state?.multiplier||1);topReward();drawLadder()}
function reward(state){let gift=state.awarded,img=$('rewardImage');img.src=gift?.image_url||TON;img.onerror=()=>{img.onerror=null;img.src=TON};img.alt=gift?.name||'TON';$('rewardName').textContent=gift?gift.name:money(state.payout)+' TON';$('rewardPrice').textContent=gift?money(gift.price_ton)+' TON':'';let extra=$('rewardExtra');extra.classList.toggle('hidden',!gift||!state.payout);extra.textContent=gift&&state.payout?`Остаток ${money(state.payout)} TON добавлен на баланс`:'';$('rewardModal').classList.remove('hidden');$('claimReward').focus()}
$('claimReward').onclick=()=>{$('rewardModal').classList.add('hidden');loadInventory()};
async function openCell(i){if(busy)return;busy=true;paint();try{let d=await api('/api/game/open',{method:'POST',body:JSON.stringify({cell:i})});round=d.round;setUser(d.user);recentCell=i;if(round.state!=='active'){lastRound=round;round=null;if(lastRound.state==='won')reward(lastRound);else toast('Мина. Попробуйте ещё раз')}busy=false;paint()}catch(e){toast(e.message);busy=false;paint()}}
$('start').onclick=async()=>{if(busy)return;busy=true;try{let d=await api('/api/game/start',{method:'POST',body:JSON.stringify({bet:$('bet').value,mines})});round=d.round;lastRound=null;setUser(d.user);await refreshLadder();paint()}catch(e){toast(e.message)}finally{busy=false}};
$('cashout').onclick=async()=>{if(busy)return;busy=true;try{let d=await api('/api/game/cashout',{method:'POST',body:'{}'});lastRound=d.round;round=null;setUser(d.user);paint();reward(lastRound)}catch(e){toast(e.message)}finally{busy=false}};
$('minusMine').onclick=()=>{if(round)return;mines=Math.max(1,mines-1);lastRound=null;paint();refreshLadder()};$('plusMine').onclick=()=>{if(round)return;mines=Math.min(20,mines+1);lastRound=null;paint();refreshLadder()};
let ladderTimer;$('bet').oninput=()=>{clearTimeout(ladderTimer);ladderTimer=setTimeout(refreshLadder,250)};
document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{let amount=Number($('bet').value)||.1,limit=Math.min(1000,user?.balance||0);switch(b.dataset.bet){case'min':amount=.1;break;case'half':amount/=2;break;case'double':amount*=2;break;case'max':amount=limit;break}$('bet').value=Math.max(.1,Math.min(1000,amount)).toFixed(2);refreshLadder()});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));$('adminEntry').onclick=()=>show('adminPage');$('adminHome').onclick=()=>show('minesPage');$('openPortal').onclick=()=>show('portalPage');$('portalBack').onclick=()=>show('adminPage');$('openUsers').onclick=()=>show('usersPage');$('usersBack').onclick=()=>show('adminPage');$('userBack').onclick=()=>show('usersPage');
async function loadCatalog(){try{let d=await api('/api/catalog');catalogItems=d.gifts;let grid=$('giftGrid');grid.replaceChildren();for(let gift of catalogItems.slice(0,100))grid.append(itemCard(gift));$('giftCount').textContent=catalogItems.length;$('portalStatus').classList.remove('error');$('portalStatus').textContent=d.updated_at?`Сохранено ${catalogItems.length} коллекций · PNG: ${catalogItems.filter(g=>g.image_match).length} · ${new Date(d.updated_at).toLocaleString('ru-RU')}`:'Каталог ещё не загружен.';let select=$('adminGift');select.replaceChildren();for(let gift of catalogItems)select.add(new Option(`${gift.name} · ${gift.price_ton??'?'} TON`,gift.id))}catch(e){toast(e.message)}}
$('importPortal').onclick=async()=>{let b=$('importPortal');b.disabled=true;b.textContent='Загрузка…';try{let d=await api('/api/admin/portal/import',{method:'POST',body:JSON.stringify({key:$('portalKey').value})});$('portalKey').value='';await loadCatalog();toast(`Сохранено ${d.count} коллекций`)}catch(e){$('portalStatus').classList.add('error');$('portalStatus').textContent=e.message;toast(e.message)}finally{b.disabled=false;b.textContent='Обновить каталог'}};
$('refreshImages').onclick=async()=>{let b=$('refreshImages');b.disabled=true;try{let d=await api('/api/admin/portal/images/refresh',{method:'POST',body:'{}'});await loadCatalog();toast(`PNG: ${d.matched} из ${d.count}`)}catch(e){toast(e.message)}finally{b.disabled=false}};
async function loadUsers(){try{let d=await api('/api/admin/users?q='+encodeURIComponent($('userSearch').value)),list=$('usersList');list.replaceChildren();for(let u of d.users){let b=document.createElement('button');b.className='user-row';let left=document.createElement('span');left.textContent=u.name+(u.username?' @'+u.username:'');let right=document.createElement('small');right.textContent=`${u.id} · ${money(u.balance)} TON · ${u.gifts} шт.`;b.append(left,right);b.onclick=()=>{selectedUser=u.id;show('userPage');loadUser()};list.append(b)}if(!d.users.length)list.textContent='Игроки не найдены'}catch(e){toast(e.message)}}$('findUsers').onclick=loadUsers;$('userSearch').onkeydown=e=>{if(e.key==='Enter')loadUsers()};
async function loadUser(){if(!selectedUser)return;try{let [d,c]=await Promise.all([api('/api/admin/users/'+selectedUser),api('/api/catalog')]);$('adminUserName').textContent=d.user.name;$('adminUserId').textContent=`ID ${d.user.id}${d.user.username?' · @'+d.user.username:''}`;$('adminBalance').value=money(d.user.balance);catalogItems=c.gifts;let select=$('adminGift');select.replaceChildren();for(let gift of catalogItems)select.add(new Option(`${gift.name} · ${gift.price_ton??'?'} TON`,gift.id));let list=$('adminInventory');list.replaceChildren();for(let item of d.items){let row=document.createElement('div');row.className='user-row';let label=document.createElement('span');label.textContent=`${item.name} · ${money(item.price_ton)} TON`;let del=document.createElement('button');del.className='danger-btn';del.textContent='Удалить';del.onclick=async()=>{try{await api(`/api/admin/users/${selectedUser}/inventory/${item.id}`,{method:'DELETE'});loadUser();if(selectedUser===user.id)loadInventory()}catch(e){toast(e.message)}};row.append(label,del);list.append(row)}if(!d.items.length)list.textContent='Инвентарь пуст'}catch(e){toast(e.message)}}
$('saveBalance').onclick=async()=>{try{await api(`/api/admin/users/${selectedUser}/balance`,{method:'POST',body:JSON.stringify({balance:$('adminBalance').value})});loadUser();if(selectedUser===user.id)setUser((await api('/api/me')).user);toast('Баланс сохранён')}catch(e){toast(e.message)}};
$('creditDeposit').onclick=async()=>{let b=$('creditDeposit');b.disabled=true;try{let key=(globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2)).replaceAll('-','');await api(`/api/admin/users/${selectedUser}/deposit`,{method:'POST',body:JSON.stringify({amount:$('depositAmount').value,request_key:key})});$('depositAmount').value='';loadUser();if(selectedUser===user.id)setUser((await api('/api/me')).user);toast('Депозит зачислен')}catch(e){toast(e.message)}finally{b.disabled=false}};
$('addGift').onclick=async()=>{try{await api(`/api/admin/users/${selectedUser}/inventory`,{method:'POST',body:JSON.stringify({gift_id:$('adminGift').value})});loadUser();if(selectedUser===user.id)loadInventory();toast('Подарок добавлен')}catch(e){toast(e.message)}};
async function boot(){try{tg?.ready();tg?.expand();let initData=tg?.initData;if(!initData)throw Error('Откройте приложение кнопкой Telegram-бота.');await api('/api/auth',{method:'POST',body:JSON.stringify({initData})});let d=await api('/api/me');round=d.round;if(round){mines=round.mines;$('bet').value=money(round.bet)}setUser(d.user);await refreshLadder();paint();$('auth').classList.add('hidden');$('content').classList.remove('hidden');$('nav').classList.remove('hidden')}catch(e){$('content').classList.add('hidden');$('nav').classList.add('hidden');$('auth').classList.remove('hidden');$('authText').textContent=e.message}}$('retry').onclick=boot;boot();
</script></body></html>
